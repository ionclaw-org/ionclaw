name: Build macOS

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Also build full release packages"
        type: boolean
        default: false
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false

env:
  BUILD_TYPE: Release
  CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm-cache

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (arm64)
            arch: arm64
            artifact: ionclaw-macos-arm64
            cmake_extra: ""
          - name: macOS (x86_64)
            arch: x86_64
            artifact: ionclaw-macos-x86_64
            cmake_extra: -DCMAKE_OSX_ARCHITECTURES=x86_64

    name: ${{ matrix.name }}
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build web client
        run: |
          cd apps/web
          npm install
          npm run build

      - name: Cache CPM packages
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.CPM_SOURCE_CACHE }}
            build/release/_deps
          key: cpm-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('cmake/cpm/cpm-dependency.cmake') }}
          restore-keys: cpm-${{ runner.os }}-${{ matrix.arch }}-

      - name: Configure
        run: cmake -B build/release -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} ${{ matrix.cmake_extra }}

      - name: Build
        run: cmake --build build/release --config ${{ env.BUILD_TYPE }} -j$(sysctl -n hw.ncpu)

      - name: Verify binary
        if: matrix.cmake_extra == ''
        run: ./build/release/bin/ionclaw-server --help

      - name: Smoke test (server + system info + cron timezone)
        if: matrix.cmake_extra == ''
        run: |
          BIN=./build/release/bin/ionclaw-server
          "$BIN" init ./smoke
          "$BIN" start --project ./smoke --host 127.0.0.1 --port 8123 &
          SRV=$!
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8123/api/health >/dev/null && break; sleep 1; done
          TOKEN=$(curl -s -X POST http://127.0.0.1:8123/api/auth/login -H 'Content-Type: application/json' -d '{"username":"admin","password":"admin"}' | python3 -c "import sys,json;print(json.load(sys.stdin)['token'])")
          INFO=$(curl -s http://127.0.0.1:8123/api/system/info -H "Authorization: Bearer $TOKEN")
          echo "$INFO"
          curl -s -X POST http://127.0.0.1:8123/api/scheduler/jobs -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d '{"name":"tz","message":"x","cron_expr":"30 12 * * *","timezone":"America/New_York"}' >/dev/null
          JOBS=$(curl -s http://127.0.0.1:8123/api/scheduler/jobs -H "Authorization: Bearer $TOKEN")
          kill $SRV 2>/dev/null || true
          echo "$INFO" | python3 -c "import sys,json; d=json.load(sys.stdin); assert d['os']['system'] not in ('Unknown','',None), 'os.system empty'; assert d['os']['machine'] not in ('',None), 'os.machine empty'; assert d['cpu']['processor'] not in ('unknown','',None), 'cpu.processor empty'; assert d['version'], 'version empty'; print('SMOKE OK', d['os']['system'], d['os']['machine'])"
          echo "$JOBS" | python3 -c "import sys,json,datetime; j=json.load(sys.stdin); j=j if isinstance(j,list) else j.get('jobs',[]); job=next(x for x in j if x['schedule']['tz']=='America/New_York'); dt=datetime.datetime.utcfromtimestamp(job['state']['next_run_ms']/1000); assert dt.minute==30 and dt.hour in (16,17), f'CRON TZ WRONG: {dt} UTC'; print('CRON TZ OK: 12:30 America/New_York =', dt.strftime('%H:%M'), 'UTC')"

      - name: Verify binary architecture
        if: matrix.cmake_extra != ''
        run: file build/release/bin/ionclaw-server

      - name: Package server
        run: |
          mkdir -p dist/${{ matrix.artifact }}
          cp build/release/bin/ionclaw-server dist/${{ matrix.artifact }}/
          cp LICENSE.md dist/${{ matrix.artifact }}/
          tar -czf ${{ matrix.artifact }}.tar.gz -C dist ${{ matrix.artifact }}

      - name: Build PKG installer
        if: ${{ inputs.release }}
        run: |
          cpack --config build/release/CPackConfig.cmake -C ${{ env.BUILD_TYPE }} -G productbuild -B dist/pkg
          pkg=$(find dist/pkg -maxdepth 1 -name "*.pkg" | head -1)
          cp "$pkg" ${{ matrix.artifact }}.pkg

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: ignore
          path: |
            ${{ matrix.artifact }}.tar.gz
            ${{ matrix.artifact }}.pkg
