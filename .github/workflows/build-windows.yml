name: Build Windows

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Also build the MSI installer"
        type: boolean
        default: false
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false

env:
  BUILD_TYPE: Release
  CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm-cache

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows (x86_64)
            arch: x86_64
            artifact: ionclaw-windows-x86_64

    name: ${{ matrix.name }}
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build web client
        run: |
          cd apps/web
          npm install
          npm run build

      - name: Cache CPM packages
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.CPM_SOURCE_CACHE }}
            build/release/_deps
          key: cpm-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('cmake/cpm/cpm-dependency.cmake') }}
          restore-keys: cpm-${{ runner.os }}-${{ matrix.arch }}-

      - name: Configure
        run: cmake -B build/release -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
      - name: Build
        run: cmake --build build/release --config ${{ env.BUILD_TYPE }} --parallel

      - name: Verify binary
        run: build/release/bin/ionclaw-server.exe --help

      - name: Smoke test (server + system info + version resource)
        shell: pwsh
        run: |
          $bin = "build/release/bin/ionclaw-server.exe"
          & $bin init ./smoke
          $srv = Start-Process $bin -ArgumentList 'start','--project','./smoke','--host','127.0.0.1','--port','8123' -PassThru
          for ($i = 0; $i -lt 30; $i++) { try { Invoke-RestMethod http://127.0.0.1:8123/api/health | Out-Null; break } catch { Start-Sleep 1 } }
          $tok = (Invoke-RestMethod -Method Post http://127.0.0.1:8123/api/auth/login -Body '{"username":"admin","password":"admin"}' -ContentType 'application/json').token
          $info = Invoke-RestMethod http://127.0.0.1:8123/api/system/info -Headers @{ Authorization = "Bearer $tok" }
          $info | ConvertTo-Json
          $fileVersion = (Get-Item $bin).VersionInfo.FileVersion
          Write-Host "exe file version: $fileVersion"
          Stop-Process -Id $srv.Id -Force
          if ($info.os.system -eq 'Unknown' -or -not $info.os.system) { throw 'os.system empty' }
          if (-not $info.os.machine) { throw 'os.machine empty' }
          if ($info.cpu.processor -eq 'unknown' -or -not $info.cpu.processor) { throw 'cpu.processor empty' }
          if ($fileVersion -notlike '1.0.6*') { throw "exe version resource wrong: $fileVersion" }
          Write-Host "SMOKE OK $($info.os.system) $($info.os.machine)"

      - name: Package server
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/${{ matrix.artifact }}
          $exe = Get-ChildItem -Path build/release -Recurse -Filter "ionclaw-server.exe" | Select-Object -First 1
          Copy-Item $exe.FullName dist/${{ matrix.artifact }}/
          Copy-Item LICENSE.md dist/${{ matrix.artifact }}/
          Compress-Archive -Path dist/${{ matrix.artifact }} -DestinationPath ${{ matrix.artifact }}.zip

      - name: Install WiX Toolset
        if: ${{ inputs.release }}
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip" -OutFile wix314.zip
          Expand-Archive -Path wix314.zip -DestinationPath "$env:RUNNER_TEMP\wix" -Force
          "$env:RUNNER_TEMP\wix" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Build MSI installer
        if: ${{ inputs.release }}
        shell: pwsh
        run: |
          cpack --config build/release/CPackConfig.cmake -C ${{ env.BUILD_TYPE }} -G WIX -B dist/wix
          $msi = Get-ChildItem -Path dist/wix -Recurse -Filter "*.msi" | Select-Object -First 1
          Copy-Item $msi.FullName "${{ matrix.artifact }}.msi"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: ignore
          path: |
            ${{ matrix.artifact }}.zip
            ${{ matrix.artifact }}.msi
