name: Build Linux

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Also build full release packages"
        type: boolean
        default: false
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false

env:
  BUILD_TYPE: Release
  CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm-cache

jobs:
  build:
    name: Linux (x86_64)
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build web client
        run: |
          cd apps/web
          npm install
          npm run build

      - name: Cache CPM packages
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.CPM_SOURCE_CACHE }}
            build/release/_deps
          key: cpm-${{ runner.os }}-x86_64-${{ hashFiles('cmake/cpm/cpm-dependency.cmake') }}
          restore-keys: cpm-${{ runner.os }}-x86_64-

      - name: Configure
        run: cmake -B build/release -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
      - name: Build
        run: cmake --build build/release --config ${{ env.BUILD_TYPE }} -j$(nproc)

      - name: Verify binary
        run: ./build/release/bin/ionclaw-server --help

      - name: Package server
        run: |
          mkdir -p dist/ionclaw-linux-x86_64
          cp build/release/bin/ionclaw-server dist/ionclaw-linux-x86_64/
          cp LICENSE.md dist/ionclaw-linux-x86_64/
          tar -czf ionclaw-linux-x86_64.tar.gz -C dist ionclaw-linux-x86_64

      - name: Build DEB installer
        if: ${{ inputs.release }}
        run: |
          cpack --config build/release/CPackConfig.cmake -C ${{ env.BUILD_TYPE }} -G DEB -B dist/deb
          deb=$(find dist/deb -maxdepth 1 -name "*.deb" | head -1)
          cp "$deb" ionclaw-linux-x86_64.deb

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ionclaw-linux-x86_64
          if-no-files-found: ignore
          path: |
            ionclaw-linux-x86_64.tar.gz
            ionclaw-linux-x86_64.deb
